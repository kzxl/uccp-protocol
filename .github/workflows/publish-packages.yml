name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version (e.g. 1.0.0 or 1.0.1-preview)'
        required: false
        default: ''

jobs:
  publish:
    name: Build, Test & Push NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Determine Package Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}" # Strip leading 'v' if present (e.g. v1.0.0 -> 1.0.0)
          else
            VERSION="1.0.0"
          fi
          echo "RESOLVED_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building and packaging version: $VERSION"

      - name: Restore Dependencies
        run: dotnet restore UCCP.slnx

      - name: Build Solution (Release)
        run: dotnet build UCCP.slnx -c Release --no-restore -p:Version=${{ steps.get_version.outputs.RESOLVED_VERSION }}

      - name: Run Test Suite
        run: dotnet test tests/UCCP.Tests/UCCP.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack NuGet Packages
        run: |
          VERSION="${{ steps.get_version.outputs.RESOLVED_VERSION }}"
          mkdir -p artifacts/packages
          
          dotnet pack src/UCCP.Core/UCCP.Core.csproj -c Release --no-build -o artifacts/packages -p:Version=$VERSION -p:PackageVersion=$VERSION
          dotnet pack src/UCCP.Runtime/UCCP.Runtime.csproj -c Release --no-build -o artifacts/packages -p:Version=$VERSION -p:PackageVersion=$VERSION
          dotnet pack src/UCCP.Adapters.Mcp/UCCP.Adapters.Mcp.csproj -c Release --no-build -o artifacts/packages -p:Version=$VERSION -p:PackageVersion=$VERSION
          dotnet pack src/UCCP.Adapters.InProc/UCCP.Adapters.InProc.csproj -c Release --no-build -o artifacts/packages -p:Version=$VERSION -p:PackageVersion=$VERSION

      - name: Archive Packages as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uccp-nuget-packages-${{ steps.get_version.outputs.RESOLVED_VERSION }}
          path: artifacts/packages/*

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key $NUGET_API_KEY \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
