name: Publish NuGet Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version (e.g. 1.0.0 or 1.0.1)'
        required: false
        default: '1.0.0'

jobs:
  publish:
    name: Build, Test & Push NuGet Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Determine Package Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="1.0.0"
          fi
          echo "RESOLVED_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building and packaging version: $VERSION"

      - name: Restore Dependencies
        run: dotnet restore UCCP.slnx

      - name: Build Solution (Release)
        run: dotnet build UCCP.slnx -c Release --no-restore -p:Version=${{ steps.get_version.outputs.RESOLVED_VERSION }}

      - name: Run Test Suite
        run: dotnet test tests/UCCP.Tests/UCCP.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack NuGet Packages
        run: |
          VERSION="${{ steps.get_version.outputs.RESOLVED_VERSION }}"
          mkdir -p artifacts/packages
          
          dotnet pack src/UCCP.Core/UCCP.Core.csproj -c Release --no-build -o artifacts/packages -p:Version=$VERSION -p:PackageVersion=$VERSION
          dotnet pack src/UCCP.Runtime/UCCP.Runtime.csproj -c Release --no-build -o artifacts/packages -p:Version=$VERSION -p:PackageVersion=$VERSION
          dotnet pack src/UCCP.Adapters.Mcp/UCCP.Adapters.Mcp.csproj -c Release --no-build -o artifacts/packages -p:Version=$VERSION -p:PackageVersion=$VERSION
          dotnet pack src/UCCP.Adapters.InProc/UCCP.Adapters.InProc.csproj -c Release --no-build -o artifacts/packages -p:Version=$VERSION -p:PackageVersion=$VERSION

      - name: Archive Packages as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uccp-nuget-packages-${{ steps.get_version.outputs.RESOLVED_VERSION }}
          path: artifacts/packages/*

      - name: Push to GitHub Packages
        continue-on-error: true
        run: |
          dotnet nuget add source --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "github" \
            --skip-duplicate || true

      - name: Push to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY secret is not set in GitHub repository settings. Skipping push to NuGet.org."
            exit 0
          fi
          echo "Pushing packages to NuGet.org..."
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
